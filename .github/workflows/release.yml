name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Never publish a release that the five gates would reject. Also refuse a tag
  # that disagrees with VERSION, so the asset, the tag and the version can't drift.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: VERSION matches tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(<VERSION)"
          if [[ "$tag_version" != "$file_version" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION (${file_version})"
            exit 1
          fi
          echo "Releasing v${file_version}"

      - name: Bash syntax
        run: |
          find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n install.sh

      - name: ShellCheck
        run: |
          mapfile -t shell_files < <(find lib tests kickstart -type f -name '*.sh' | sort)
          shellcheck -s bash -x -e SC1090,SC1091 install.sh "${shell_files[@]}"

      - name: Formatting
        run: |
          shfmt -d -i 2 -ci install.sh lib tests kickstart

      - name: Kickstart validation
        run: |
          kickstart/validate-kickstart.sh

      - name: Tests
        run: |
          for test_file in tests/*_test.sh; do
            echo "=== Running $test_file ==="
            "$test_file"
          done

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Only this job may write; the verify job above cannot publish anything even
    # if a step in it were compromised.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deterministic on purpose: same commit must give the same bytes, so a
      # published checksum can be reproduced by anyone. `gzip -n` drops the
      # timestamp git archive would otherwise embed.
      - name: Build source archive and checksums
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          name="tophat-${GITHUB_REF_NAME}"

          git archive --format=tar --prefix="${name}/" -o "${name}.tar" HEAD
          gzip -n -9 "${name}.tar"
          rm -f "${name}.tar"

          git archive --format=tar --prefix="${name}/" -o /tmp/rebuild.tar HEAD
          gzip -n -9 -c /tmp/rebuild.tar >/tmp/rebuild.tar.gz

          first="$(sha256sum "${name}.tar.gz" | cut -d' ' -f1)"
          second="$(sha256sum /tmp/rebuild.tar.gz | cut -d' ' -f1)"
          if [[ "$first" != "$second" ]]; then
            echo "::error::archive is not reproducible ($first vs $second)"
            exit 1
          fi
          echo "reproducible archive: $first"

          printf '%s  %s\n' "$first" "${name}.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      # The annotated tag body is the release body: it is written once, at tag
      # time, next to the code it describes.
      - name: Collect release notes from the annotated tag
        run: |
          tag="${GITHUB_REF_NAME}"
          # actions/checkout can leave a *lightweight* tag pointing at the
          # commit, whose %(contents) is just the commit message. Force-fetch
          # the real tag object so the annotation is what ends up published.
          git fetch --force origin "+refs/tags/${tag}:refs/tags/${tag}"
          git for-each-ref "refs/tags/${tag}" --format='%(contents)' > release-notes.md

          if [[ "$(git cat-file -t "$tag")" != "tag" ]]; then
            echo "::error::${tag} is not an annotated tag; release notes cannot be derived"
            exit 1
          fi
          if ! grep -q . release-notes.md; then
            echo "::error::${tag} has an empty annotation"
            exit 1
          fi
          echo '--- release notes (first 3 lines) ---'
          head -3 release-notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          archive="tophat-${tag}.tar.gz"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refreshing notes and assets"
            gh release edit "$tag" --notes-file release-notes.md
            gh release upload "$tag" "$archive" SHA256SUMS --clobber
          else
            gh release create "$tag" \
              --title "Tophat $tag" \
              --notes-file release-notes.md \
              --verify-tag \
              "$archive" \
              SHA256SUMS
          fi
