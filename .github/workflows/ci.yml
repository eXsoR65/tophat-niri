name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      # VERSION and the install.sh header drift apart easily; the release
      # workflow only compares VERSION against the tag.
      - name: Version consistency
        run: |
          version="$(<VERSION)"
          header="$(sed -n '3s/.*Tophat v\([0-9][0-9.]*\).*/\1/p' install.sh)"
          echo "VERSION=${version} install.sh=${header}"
          if [[ "$version" != "$header" ]]; then
            echo "::error::VERSION (${version}) disagrees with the install.sh header (${header})"
            exit 1
          fi

      - name: Bash syntax
        run: |
          find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n install.sh

      - name: ShellCheck
        run: |
          mapfile -t shell_files < <(find lib tests kickstart -type f -name '*.sh' -print | sort)
          shellcheck -s bash -x -e SC1090,SC1091 install.sh "${shell_files[@]}"

      - name: Formatting
        run: |
          shfmt -d -i 2 -ci install.sh lib tests kickstart

      - name: Kickstart validation
        run: |
          kickstart/validate-kickstart.sh

      - name: Tests
        run: |
          for test_file in tests/*_test.sh; do
            echo "=== Running $test_file ==="
            "$test_file"
          done

  # The Ubuntu job proves style; this one proves the engine runs on Fedora,
  # where dnf5, /etc/greetd and the real package names exist. Deliberately
  # narrow: ShellCheck and shfmt stay on Ubuntu (Fedora packaging of both is
  # not something a gate should depend on), and no process substitution is
  # used, so the container needs nothing beyond bash + findutils.
  fedora:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A failure inside the container is otherwise invisible in the checks
      # UI; re-emit the tail as an annotation so red runs explain themselves.
      - name: Pull Fedora image
        run: docker pull --quiet fedora:latest

      - name: Run gates on Fedora
        run: |
          set -uo pipefail
          log="$(mktemp)"
          if docker run --rm -i --volume "$PWD:/src" --workdir /src \
            fedora:latest bash -s >"$log" 2>&1 <<'FEDORA_EOF'
          set -euo pipefail

          echo "OS:     $(grep PRETTY_NAME /etc/os-release)"
          echo "bash:   $(bash --version | head -1)"
          echo "dnf:    $(dnf --version | head -1)"

          # dnf5 exits non-zero when there is nothing to do (packages already
          # present), so its exit status is not a reliable signal here. Install,
          # tolerate that, then verify the prerequisites are actually there.
          dnf install -y --setopt=install_weak_deps=False findutils gawk ||
            echo "dnf returned non-zero; verifying packages instead of trusting it"
          for pkg in findutils gawk; do
            rpm -q "$pkg" >/dev/null 2>&1 || {
              echo "prerequisite missing: $pkg" >&2
              exit 1
            }
          done

          echo '=== Bash syntax ==='
          find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n install.sh

          echo '=== Kickstart validation ==='
          kickstart/validate-kickstart.sh

          echo '=== Tests ==='
          for test_file in tests/*_test.sh; do
            echo "--- $test_file ---"
            "$test_file"
          done

          echo '=== CLI smoke tests ==='
          ./install.sh --version
          ./install.sh --help >/dev/null
          FEDORA_EOF
          then
            cat "$log"
            exit 0
          fi

          cat "$log"
          # GitHub surfaces at most ~10 annotations per step, so one line per
          # echo hides the interesting part. Emit a single annotation with the
          # tail and let %0A carry the newlines.
          msg="$(tail -15 "$log" | while IFS= read -r line; do
            line="${line//'%'/%25}"
            printf '%s%%0A' "$line"
          done)"
          echo "::error::Fedora gate failed:%0A${msg}"
          exit 1
