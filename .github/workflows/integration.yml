name: Integration

# A real install pulls the whole desktop stack (several GB, 10-20 minutes), so
# this never runs on every push. It runs:
#   - on demand, for any Fedora release (including the next one, pre-GA)
#   - weekly, as a drift alarm: a package rename or a lagging COPR shows up as a
#     failure before a user hits it
#   - on every v* tag, against the exact code being released
# Only main carries v2.7-style markers, which is what the assertions describe.
on:
  workflow_dispatch:
    inputs:
      container:
        description: Fedora image to install into
        required: true
        default: fedora:45
        type: choice
        options:
          - fedora:45
          - fedora:latest
          - fedora:rawhide
  schedule:
    - cron: '0 5 * * 1'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  install:
    name: real install on ${{ inputs.container || 'fedora:latest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The container gets its own copy of the image; the runner's disk is the
      # constraint, not CPU. Reclaim what the base image ships and unused.
      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # Pulled in its own step so image progress does not bury the install log
      # that gets surfaced when the gates fail.
      - name: Pull image
        run: docker pull --quiet ${{ inputs.container || 'fedora:latest' }}

      # The fedora image is deliberately minimal: it ships dnf, bash and
      # coreutils-single but no init and no user management tools, so systemd
      # and shadow-utils (for the harness's useradd) are installed inside it and
      # systemd is then exec'd as PID 1 (exec replaces bash, so systemd is not a
      # child process).
      - name: Start a systemd container
        run: |
          docker run -d --name tophat-it \
            --privileged --cgroupns=host \
            --hostname tophat-it \
            --tmpfs /run --tmpfs /run/lock \
            --volume /sys/fs/cgroup:/sys/fs/cgroup:rw \
            ${{ inputs.container || 'fedora:latest' }} \
            /bin/bash -c 'dnf install -y --setopt=install_weak_deps=False systemd shadow-utils && exec /usr/lib/systemd/systemd'

          for attempt in $(seq 1 90); do
            state="$(docker exec tophat-it systemctl is-system-running 2>/dev/null || true)"
            case "$state" in
              running | degraded) echo "systemd is ${state}"; exit 0 ;;
            esac
            sleep 2
          done

          echo 'systemd did not start; container log follows'
          docker logs tophat-it || true
          exit 1

      - name: Copy the repository in
        run: |
          docker cp "$PWD/." tophat-it:/src
          docker exec --workdir /src tophat-it bash -c 'ls -la | head; cat VERSION'

      - name: Real install and verification
        run: |
          set -uo pipefail
          log="$(mktemp)"

          if docker exec --workdir /src tophat-it \
            env TARGET_USER=tophat-it \
            bash /src/tests/integration/container-install.sh >"$log" 2>&1; then
            grep -E '^===|PASS|^Tophat' "$log" || tail -20 "$log"
            exit 0
          fi

          echo '--- integration log (tail) ---'
          tail -60 "$log"
          echo '--- installer log (tail) ---'
          docker exec tophat-it tail -60 /var/log/tophat/latest.log 2>/dev/null || true
          echo '--- state directory ---'
          docker exec tophat-it ls -la /var/lib/tophat 2>/dev/null || true
          echo '--- journal (tail) ---'
          docker exec tophat-it journalctl -n 40 --no-pager 2>/dev/null || true

          msg="$(tail -15 "$log" | while IFS= read -r line; do
            line="${line//'%'/%25}"
            printf '%s%%0A' "$line"
          done)"
          echo "::error::integration install failed (${{ inputs.container || 'fedora:latest' }}):%0A${msg}"
          exit 1

      - name: Remove the container
        if: always()
        run: docker rm -f tophat-it || true
